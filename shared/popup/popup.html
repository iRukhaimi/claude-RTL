<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Claude RTL</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        margin: 0;
        padding: 14px 16px;
        min-width: 220px;
        font-size: 14px;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 14px;
        font-weight: 600;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .switch {
        position: relative;
        width: 36px;
        height: 20px;
        flex: none;
      }
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: absolute;
        inset: 0;
        background: #ccc;
        border-radius: 20px;
        cursor: pointer;
        transition: background 0.15s;
      }
      .slider::before {
        content: "";
        position: absolute;
        height: 16px;
        width: 16px;
        left: 2px;
        top: 2px;
        background: white;
        border-radius: 50%;
        transition: transform 0.15s;
      }
      input:checked + .slider {
        background: #d97757;
      }
      input:checked + .slider::before {
        transform: translateX(16px);
      }
      .hint {
        margin-top: 10px;
        font-size: 12px;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <h1>Claude RTL</h1>
    <div class="row">
      <span>Auto RTL/LTR</span>
      <label class="switch">
        <input type="checkbox" id="toggle" />
        <span class="slider"></span>
      </label>
    </div>
    <div class="hint">Per-paragraph direction on claude.ai</div>
    <script src="popup.js"></script>
  </body>
</html>
